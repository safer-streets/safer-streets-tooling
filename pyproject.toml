[project]
name = "safer-streets-tooling"
version = "0.1.0"
authors = [
    { name = "Andrew Smith", email = "a.p.smith@leeds.ac.uk" }
]
description = "Data-build tooling for safer-streets: per-dataset extract → GeoParquet → assemble DuckDB."
requires-python = ">=3.13"
dependencies = [
    "beahiv[arrow]",
    # Runtime libraries (duckdb, geopandas, pandas, pyarrow, shapely, scipy, requests, tqdm, typer,
    # networkx, odfpy, overturemaps) come transitively from safer-streets-core, which declares them all.
    "safer-streets-core",
]

[project.scripts]
data = "safer_streets_tooling.data_pipeline:main"

[tool.uv.sources]
safer-streets-core = { path = "../safer-streets-core", editable = true }
beahiv = { path = "../beahiv", editable = true }

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9",
    "pytest-cov>=7",
    "ruff>=0.15.12",
    "ty>=0.0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "--cov=src/safer_streets_tooling --cov-report html --cov-fail-under=65"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["A", "B", "E", "F", "I", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D103"]

[tool.ty.rules]
invalid-assignment = "ignore"
unresolved-attribute = "ignore"
no-matching-overload = "ignore"
